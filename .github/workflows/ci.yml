name: CI

on:
  push:
  pull_request:

jobs:
  test_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --version
      - run: npm test

  build_app:
    runs-on: ubuntu-latest
    needs: test_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Short SHA
        id: shortsha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: devops-lab5-${{ steps.shortsha.outputs.sha }}
          path: dist/
          retention-days: 7
